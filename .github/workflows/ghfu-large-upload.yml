# Managed by GitHub Files Uploader. Do not rename this workflow.
name: GitHub Files Uploader - Large File
run-name: Large upload - ${{ github.event.client_payload.job_id }}
on:
  repository_dispatch:
    types: [ghfu-large-upload-v2]
permissions:
  contents: write
concurrency:
  group: ghfu-large-${{ github.event.client_payload.path_key }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download in parallel and commit without a full checkout
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, re, shutil, subprocess, tempfile, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path, PurePosixPath
          
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text("utf-8"))
          payload = event["client_payload"]
          path = str(payload["path"])
          target = PurePosixPath(path)
          job_id = str(payload["job_id"])
          parts = payload["parts"]
          size = int(payload["size"])
          if (not target.parts or target.is_absolute() or ".." in target.parts
                  or ".git" in target.parts or target.parts[0] == ".ghfu-results"
                  or path != str(target) or "\x00" in path):
              raise SystemExit("Unsafe target path")
          if not re.fullmatch(r"[a-z0-9-]{8,80}", job_id):
              raise SystemExit("Invalid job identifier")
          if (not isinstance(parts, list) or not 1 <= len(parts) <= 100
                  or not all(re.fullmatch(r"[0-9a-f]{40}", str(p)) for p in parts)):
              raise SystemExit("Invalid chunks")
          if not 0 < size <= 100 * 1024 * 1024:
              raise SystemExit("File exceeds GitHub's 100 MiB limit")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          with tempfile.TemporaryDirectory(prefix="ghfu-") as directory:
              work = Path(directory)
              def download(entry):
                  index, sha = entry
                  local = work / f"part-{index}"
                  for attempt in range(4):
                      try:
                          request = urllib.request.Request(f"{api}/repos/{repo}/git/blobs/{sha}", headers={
                              "Accept": "application/vnd.github.raw+json",
                              "Authorization": f"Bearer {token}",
                              "X-GitHub-Api-Version": "2022-11-28"})
                          count = 0
                          with urllib.request.urlopen(request, timeout=120) as response, local.open("wb") as output:
                              while chunk := response.read(1024 * 1024):
                                  count += len(chunk)
                                  if count > min(size, 8 * 1024 * 1024):
                                      raise ValueError("Chunk exceeds size limit")
                                  output.write(chunk)
                          digest = hashlib.sha1(f"blob {count}\0".encode())
                          with local.open("rb") as source:
                              while chunk := source.read(1024 * 1024):
                                  digest.update(chunk)
                          if digest.hexdigest() != sha:
                              raise ValueError("Chunk integrity check failed")
                          print(f"Downloaded chunk {index + 1}/{len(parts)}", flush=True)
                          return local, count
                      except (urllib.error.URLError, TimeoutError, OSError) as error:
                          if isinstance(error, urllib.error.HTTPError) and error.code not in (403, 429, 500, 502, 503, 504):
                              raise
                          if attempt == 3:
                              raise
                          wait = 2 ** attempt
                          if isinstance(error, urllib.error.HTTPError):
                              wait = min(60, max(wait, int(error.headers.get("Retry-After", "0") or 0)))
                          time.sleep(wait)
              assembled = work / "assembled"
              total = 0
              with ThreadPoolExecutor(max_workers=min(6, len(parts))) as pool, assembled.open("wb") as output:
                  for local, count in pool.map(download, enumerate(parts)):
                      total += count
                      if total > size:
                          raise SystemExit("Uploaded chunks exceed expected size")
                      with local.open("rb") as source:
                          shutil.copyfileobj(source, output, 1024 * 1024)
                      local.unlink()
              if total != size:
                  raise SystemExit(f"Size mismatch: expected {size}, got {total}")
              # Fetch only the latest commit and trees. Never download repository files/history.
              gitdir = work / "repo"
              gitdir.mkdir()
              def git(*args, input=None, check=True):
                  return subprocess.run(["git", *args], cwd=gitdir, input=input, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=check)
              git("init", "-q")
              git("remote", "add", "origin", f"{server}/{repo}.git")
              git("config", "remote.origin.promisor", "true")
              git("config", "remote.origin.partialclonefilter", "blob:none")
              git("config", "user.name", "github-actions[bot]")
              git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
              auth = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              git("config", f"http.{server}/.extraheader", f"AUTHORIZATION: basic {auth}")
              blob = git("hash-object", "-w", "--", str(assembled)).stdout.strip()
              marker = f".ghfu-results/{job_id}.json"
              marker_blob = git("hash-object", "-w", "--stdin", input=json.dumps({"path": path, "size": size, "sha": blob})).stdout.strip()
              for attempt in range(4):
                  git("fetch", "--quiet", "--depth=1", "--filter=blob:none", "origin", branch)
                  parent = git("rev-parse", "FETCH_HEAD").stdout.strip()
                  git("read-tree", parent)
                  git("update-index", "--add", "--cacheinfo", "100644", blob, path)
                  git("update-index", "--add", "--cacheinfo", "100644", marker_blob, marker)
                  tree = git("write-tree").stdout.strip()
                  commit = git("commit-tree", tree, "-p", parent, input=f"Upload {path}\n").stdout.strip()
                  pushed = git("push", "--quiet", "origin", f"{commit}:refs/heads/{branch}", check=False)
                  if pushed.returncode == 0:
                      print("Upload committed successfully", flush=True)
                      break
                  if attempt == 3:
                      raise SystemExit("Could not push upload; check branch protection and Actions write permission")
                  # Rebuild from the latest tree so concurrent uploads/edits are preserved.
                  time.sleep(1 + attempt)
          PYTHON
